<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reports and Exports Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for horizontal scrolls */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl pb-24">
<!-- Header -->
<header class="sticky top-0 z-50 flex items-center justify-between bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md px-4 py-3 border-b border-slate-200 dark:border-slate-800">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-tight text-center text-slate-900 dark:text-white">Reports</h1>
<div class="w-10"></div> <!-- Spacer to balance back button -->
</header>
<!-- Main Content -->
<main class="flex flex-col px-5 pt-6 gap-6">
<!-- Intro -->
<div class="space-y-1">
<h2 class="text-[28px] font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Export Data</h2>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal">Select report type and date range.</p>
</div>
<!-- Report Type -->
<div class="space-y-3">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Report Type</h3>
<div class="flex gap-3 overflow-x-auto no-scrollbar pb-1 snap-x">
<!-- Selected Card -->
<button class="snap-start shrink-0 flex flex-col items-start justify-between w-32 h-28 p-3 rounded-2xl bg-primary shadow-lg shadow-primary/25 border-2 border-primary transition-all relative overflow-hidden group">
<div class="absolute right-[-10px] top-[-10px] opacity-10 rotate-12">
<span class="material-symbols-outlined text-[80px] text-white">apartment</span>
</div>
<div class="bg-white/20 p-2 rounded-full flex items-center justify-center backdrop-blur-sm">
<span class="material-symbols-outlined text-white text-[20px]">apartment</span>
</div>
<div class="text-left z-10">
<p class="text-white text-xs font-medium opacity-80">Project</p>
<p class="text-white text-sm font-bold leading-tight">Expense</p>
</div>
<!-- Checkmark for active state -->
<div class="absolute top-3 right-3 bg-white text-primary rounded-full p-[2px]">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</button>
<!-- Option Card -->
<button class="snap-start shrink-0 flex flex-col items-start justify-between w-32 h-28 p-3 rounded-2xl bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 transition-all">
<div class="bg-slate-100 dark:bg-slate-700 p-2 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined text-[20px]">monitoring</span>
</div>
<div class="text-left">
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium">Finance</p>
<p class="text-slate-900 dark:text-white text-sm font-bold leading-tight">Profit &amp; Loss</p>
</div>
</button>
<!-- Option Card -->
<button class="snap-start shrink-0 flex flex-col items-start justify-between w-32 h-28 p-3 rounded-2xl bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 transition-all">
<div class="bg-slate-100 dark:bg-slate-700 p-2 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined text-[20px]">schedule</span>
</div>
<div class="text-left">
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium">Team</p>
<p class="text-slate-900 dark:text-white text-sm font-bold leading-tight">Time Summary</p>
</div>
</button>
</div>
</div>
<!-- Filters Scope -->
<div class="space-y-4">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Scope &amp; Period</h3>
<!-- Project Dropdown -->
<div class="relative group">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 ml-1">Select Project</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-slate-400 dark:text-slate-500 material-symbols-outlined text-[20px]">domain</span>
<select class="w-full h-12 pl-10 pr-10 bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none transition-shadow">
<option>Skyline Tower A</option>
<option>Riverbridge Renovation</option>
<option>Highway 405 Extension</option>
<option>City Center Mall</option>
</select>
<span class="absolute right-3 text-slate-400 pointer-events-none material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
<!-- Date Range Grid -->
<div class="grid grid-cols-2 gap-3">
<div class="relative">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 ml-1">Start Date</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-slate-400 dark:text-slate-500 material-symbols-outlined text-[18px]">calendar_today</span>
<input class="w-full h-11 pl-9 pr-3 bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow" placeholder="Jan 1, 2023" type="text" value="Sep 01, 2023"/>
</div>
</div>
<div class="relative">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 ml-1">End Date</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-slate-400 dark:text-slate-500 material-symbols-outlined text-[18px]">event</span>
<input class="w-full h-11 pl-9 pr-3 bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow" placeholder="Select Date" type="text" value="Sep 30, 2023"/>
</div>
</div>
</div>
</div>
<!-- Format Selection -->
<div class="space-y-3">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Format</h3>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="format" type="radio"/>
<div class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px]">picture_as_pdf</span>
<span class="text-sm font-medium">PDF</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="format" type="radio"/>
<div class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px]">table_view</span>
<span class="text-sm font-medium">Excel</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="format" type="radio"/>
<div class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px]">data_object</span>
<span class="text-sm font-medium">CSV</span>
</div>
</label>
</div>
</div>
<div class="h-px w-full bg-slate-200 dark:bg-slate-800 my-2"></div>
<!-- Recent Exports -->
<div class="space-y-3 pb-8">
<div class="flex justify-between items-center">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Recent Exports</h3>
<button class="text-primary text-xs font-medium hover:underline">View All</button>
</div>
<div class="flex flex-col gap-2">
<!-- History Item 1 -->
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-light dark:bg-surface-dark border border-slate-100 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-600 transition-colors cursor-pointer group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-600 dark:text-red-400">
<span class="material-symbols-outlined text-[20px]">picture_as_pdf</span>
</div>
<div>
<p class="text-sm font-semibold text-slate-900 dark:text-white">Skyline_Exp_Aug.pdf</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Aug 01 - Aug 31 • 2.4 MB</p>
</div>
</div>
<button class="p-2 text-slate-400 hover:text-primary dark:text-slate-500 dark:hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">download</span>
</button>
</div>
<!-- History Item 2 -->
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-light dark:bg-surface-dark border border-slate-100 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-600 transition-colors cursor-pointer group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600 dark:text-green-400">
<span class="material-symbols-outlined text-[20px]">table_view</span>
</div>
<div>
<p class="text-sm font-semibold text-slate-900 dark:text-white">Full_Summary_Q2.xlsx</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Apr 01 - Jun 30 • 5.1 MB</p>
</div>
</div>
<button class="p-2 text-slate-400 hover:text-primary dark:text-slate-500 dark:hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">download</span>
</button>
</div>
</div>
</div>
</main>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 right-0 p-5 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 max-w-md mx-auto">
<button class="w-full h-12 bg-primary hover:bg-blue-600 active:bg-blue-700 text-white font-semibold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20 transition-all transform active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">download</span>
<span>Generate &amp; Download</span>
</button>
</div>
</div>
</body></html>
