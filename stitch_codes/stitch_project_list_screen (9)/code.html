<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "primary-hover": "#0f5bbd",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                        "card-light": "#ffffff",
                        "card-dark": "#1a2430",
                        "input-border": "#e2e8f0",
                        "input-border-dark": "#334155",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(600px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden flex items-center justify-center">
<div class="relative flex h-full w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark shadow-2xl min-h-[100dvh]">
<main class="flex flex-1 flex-col items-center justify-center px-8 w-full">
<div class="w-full mb-12 flex flex-col items-center">
<div class="size-20 rounded-2xl bg-primary text-white flex items-center justify-center shadow-lg mb-6">
<span class="material-symbols-outlined" style="font-size: 40px;">engineering</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">CivManager</h1>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-2 text-center">Enterprise Project &amp; Expense Control</p>
</div>
<form class="w-full space-y-5" onsubmit="event.preventDefault();">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="email">Work Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500" style="font-size: 20px;">person</span>
</div>
<input class="block w-full rounded-lg border-input-border dark:border-input-border-dark bg-white dark:bg-card-dark py-3 pl-10 pr-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm shadow-sm transition-all" id="email" name="email" placeholder="Enter your ID" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500" style="font-size: 20px;">lock</span>
</div>
<input class="block w-full rounded-lg border-input-border dark:border-input-border-dark bg-white dark:bg-card-dark py-3 pl-10 pr-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm shadow-sm transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary bg-white dark:bg-card-dark dark:border-slate-600" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-slate-600 dark:text-slate-400" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-medium text-primary hover:text-primary-hover transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-primary-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors mt-6" type="submit">
                    Sign In securely
                </button>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-background-light dark:bg-background-dark px-2 text-slate-500 dark:text-slate-400">Support</span>
</div>
</div>
<div class="mt-4 flex justify-center gap-4 text-sm text-slate-500 dark:text-slate-400">
<a class="hover:text-slate-900 dark:hover:text-white transition-colors" href="#">IT Helpdesk</a>
<span>•</span>
<a class="hover:text-slate-900 dark:hover:text-white transition-colors" href="#">System Status</a>
</div>
</div>
</main>
<footer class="p-6 text-center border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#0d131b]">
<div class="flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-slate-400" style="font-size: 20px;">verified_user</span>
<p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs leading-relaxed">
                    Access restricted to authorized personnel only. 
                    <br/>
                    Unauthorized access is prohibited and monitored.
                </p>
</div>
<p class="text-[10px] text-slate-400 dark:text-slate-500 mt-3">v2.4.0 • Build 8922</p>
</footer>
</div>

</body></html>
