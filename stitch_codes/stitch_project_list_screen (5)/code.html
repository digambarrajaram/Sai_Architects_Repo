<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Project Expense</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col group/design-root">
<!-- TopAppBar -->
<div class="flex items-center justify-between bg-background-light dark:bg-background-dark px-4 py-3 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20">
<button class="text-primary flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="text-base font-medium">Cancel</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight text-center">Add Expense</h2>
<div class="w-16"></div> <!-- Spacer to balance Cancel button -->
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto no-scrollbar pb-32">
<!-- Project Context (Read Only) -->
<div class="flex flex-col px-4 pt-6">
<h3 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wide opacity-70 mb-2">Project Details</h3>
<label class="flex flex-col w-full">
<div class="flex w-full items-stretch rounded-lg opacity-80">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-slate-600 dark:text-slate-300 focus:outline-0 focus:ring-0 border-none bg-slate-200 dark:bg-slate-800 h-14 p-4 text-base font-semibold leading-normal cursor-not-allowed" readonly="" value="Highway 101 Expansion (ID: HW-101)"/>
<div class="text-slate-500 dark:text-slate-400 flex border-none bg-slate-200 dark:bg-slate-800 items-center justify-center pr-4 rounded-r-lg pl-2">
<span class="material-symbols-outlined">lock</span>
</div>
</div>
</label>
</div>
<!-- Amount Input -->
<div class="flex flex-col px-4 pt-6">
<h3 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wide opacity-70 mb-2">Amount</h3>
<label class="flex flex-col w-full">
<div class="flex w-full items-stretch rounded-xl shadow-sm bg-white dark:bg-slate-800 ring-1 ring-slate-200 dark:ring-slate-700 focus-within:ring-2 focus-within:ring-primary transition-all duration-200">
<div class="text-slate-400 dark:text-slate-500 flex items-center justify-center pl-4">
<span class="material-symbols-outlined !text-[28px]">attach_money</span>
</div>
<input autofocus="" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-primary dark:text-primary focus:outline-0 focus:ring-0 border-none bg-transparent h-20 p-2 text-4xl font-bold leading-normal placeholder:text-slate-300 dark:placeholder:text-slate-600" inputmode="decimal" placeholder="0.00" type="number"/>
</div>
</label>
</div>
<div class="h-px bg-slate-200 dark:bg-slate-800 mx-4 my-6"></div>
<!-- Expense Form Fields -->
<div class="flex flex-col px-4 gap-5">
<!-- Category -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Category</label>
<div class="relative">
<select class="w-full appearance-none rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white h-14 px-4 pr-10 focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
<option disabled="" selected="" value="">Select category</option>
<option value="materials">Materials</option>
<option value="labor">Labor</option>
<option value="fuel">Fuel</option>
<option value="equipment">Equipment</option>
<option value="misc">Miscellaneous</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Date of Expense</label>
<div class="relative">
<input class="w-full rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white h-14 px-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-slate-400" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Notes / Description <span class="text-slate-400 font-normal">(Optional)</span></label>
<textarea class="w-full rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white p-4 min-h-[100px] focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-none" placeholder="Add details about this expense..."></textarea>
</div>
<!-- Receipt Upload -->
<div class="flex flex-col gap-2 pt-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Receipt</label>
<button class="flex items-center justify-center w-full h-24 rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
<div class="flex flex-col items-center gap-1">
<div class="p-2 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Attach Receipt</span>
</div>
</button>
</div>
</div>
<div class="h-8"></div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 z-30 pb-8">
<button class="w-full h-14 bg-primary hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-lg rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
<span>Submit Expense</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
