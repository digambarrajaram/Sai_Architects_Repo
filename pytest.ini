[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts = 
    -v 
    --tb=short 
    --strict-markers
    --html=reports/pytest_report.html
    --self-contained-html
    --maxfail=5
    --durations=10

# Markers
markers =
    smoke: Mark test as part of smoke suite
    regression: Mark test as part of regression suite
    sanity: Mark test as part of sanity suite
    login: Mark test as login related
    slow: Mark test as slow running
    cross_browser: Mark test for cross-browser testing

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution
# Use: pytest -n auto for automatic worker detection
# Use: pytest -n 4 for 4 workers

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeouts (optional, requires pytest-timeout plugin)
# timeout = 300
# timeout_method = thread
