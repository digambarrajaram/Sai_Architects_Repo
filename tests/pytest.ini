[pytest]
# Production-Grade Pytest Configuration for Mobile E2E Testing

# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose Output
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --capture=no
    --html=reports/e2e_report.html
    --self-contained-html
    --durations=10

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# HTML Report Configuration (already configured in addopts)

# Markers for Test Categorization
markers =
    smoke: Smoke tests for basic functionality
    regression: Full regression test suite
    e2e: End-to-end test scenarios
    auth: Authentication-related tests
    data: Data validation tests
    role: Role-based access tests
    critical: Critical path tests
    android: Android-specific tests
    slow: Tests that take longer to execute
    supabase: Supabase integration tests
    integration: Integration tests
    performance: Performance tests
    backend: Backend integration tests
    login: Login flow tests

# Warnings Configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Parallel Execution (if pytest-xdist is installed)
# Uncomment to enable parallel execution
# xdist_workers = auto

# Test Timeout (if pytest-timeout is installed)
# timeout = 300
# timeout_method = thread